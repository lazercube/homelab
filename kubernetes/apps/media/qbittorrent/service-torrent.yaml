# Exposes the BitTorrent protocol port via a LoadBalancer so peers can connect.
# Cilium will allocate an IP from the BGP/L2 address pool.
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-torrent
  namespace: media
  labels:
    app: qbittorrent
spec:
  type: LoadBalancer
  ports:
    - port: 6881
      targetPort: torrent-tcp
      protocol: TCP
      name: torrent-tcp
    - port: 6881
      targetPort: torrent-udp
      protocol: UDP
      name: torrent-udp
  selector:
    app: qbittorrent
